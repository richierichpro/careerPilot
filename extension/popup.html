<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CareerPilot</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17181c;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 2px;
      }
      .sub {
        font-size: 12px;
        color: #6b7280;
        margin: 0 0 14px;
      }
      .row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 0;
        border-top: 1px solid #eee;
        font-size: 12.5px;
      }
      .row:first-of-type {
        border-top: 1px solid #eee;
      }
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-top: 3px;
        background: #d1d5db;
      }
      .dot.ok {
        background: #22c55e;
      }
      .dot.bad {
        background: #ef4444;
      }
      .row-text strong {
        display: block;
        font-size: 12.5px;
      }
      .row-text span {
        color: #6b7280;
        font-size: 11.5px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      button {
        flex: 1;
        font-family: inherit;
        font-size: 12px;
        padding: 7px 0;
        border-radius: 6px;
        border: 1px solid #d1d5db;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: #2f6feb;
        color: #fff;
        border-color: #2f6feb;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <h1>CareerPilot</h1>
    <p class="sub">AI job application autofill</p>

    <div class="row">
      <div class="dot" id="backend-dot"></div>
      <div class="row-text">
        <strong id="backend-title">Checking backend…</strong>
        <span id="backend-detail"></span>
      </div>
    </div>

    <div class="row">
      <div class="dot" id="profile-dot"></div>
      <div class="row-text">
        <strong id="profile-title">Checking Career Profile…</strong>
        <span id="profile-detail"></span>
      </div>
    </div>

    <div class="row">
      <div class="dot" id="page-dot"></div>
      <div class="row-text">
        <strong id="page-title">Checking this page…</strong>
        <span id="page-detail"></span>
      </div>
    </div>

    <div class="actions">
      <button id="open-profile">Career Profile</button>
      <button id="open-tracker" class="primary">Applications</button>
    </div>

    <script src="dist/popup.js"></script>
  </body>
</html>
