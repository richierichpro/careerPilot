<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CareerPilot</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17181c;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 2px;
      }
      .sub {
        font-size: 12px;
        color: #6b7280;
        margin: 0 0 14px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      button {
        flex: 1;
        font-family: inherit;
        font-size: 12px;
        padding: 7px 0;
        border-radius: 6px;
        border: 1px solid #d1d5db;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: #2f6feb;
        color: #fff;
        border-color: #2f6feb;
      }
      button:hover:not(:disabled) {
        opacity: 0.9;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #apply-row {
        display: none;
      }
      #apply-row.visible {
        display: block;
      }
      #apply-with-ai {
        width: 100%;
        padding: 9px 0;
        font-size: 13px;
        font-weight: 600;
      }
      .apply-hint {
        font-size: 11px;
        color: #6b7280;
        margin: 6px 0 0;
      }
      .no-form {
        font-size: 12px;
        color: #6b7280;
        margin: 0 0 14px;
        padding: 8px 0;
        border-top: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <h1>CareerPilot</h1>
    <p class="sub">AI job application autofill</p>

    <div id="apply-row">
      <button id="apply-with-ai" class="primary">Apply with AI</button>
      <p class="apply-hint">Fills this page's form from your Career Profile — check the page for progress.</p>
    </div>
    <p id="no-form-hint" class="no-form">No application form detected on this page.</p>

    <div class="actions">
      <button id="open-profile">Career Profile</button>
      <button id="open-tracker" class="primary">Applications</button>
    </div>

    <script src="dist/popup.js"></script>
  </body>
</html>
